name: I would like to contribute.
description: Contributing a PR with what you are working on.
labels: "contribution"
assignees: "TheM1ddleM1n"
body:
  - type: input
    attributes:
      label: What are you adding?
      description: Tell me a short description of what you plan to add or remove.
      placeholder: Streamlining performance so everything works smoothly.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Draft Your Idea
      description: Please draft your idea here for the devs to see.
